# Netlify-Konfiguration - WJOF Vorstandsportal
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Mindestens 22.12 laut @netlify/functions und @vitejs/plugin-react.
  # Mit 20 laeuft der Build zwar, meldet aber EBADENGINE-Warnungen.
  NODE_VERSION = "22"

  # Netlifys Geheimnis-Scanner erkennt den Firebase-Web-Schluessel am Muster
  # "AIza..." und bricht den Build ab. Dieser Schluessel ist jedoch bewusst
  # oeffentlich: Er steht zwangslaeufig in jedem Browser-Bundle und ist eine
  # reine Projektkennung, kein Zugangsdatum. Geschuetzt werden die Daten durch
  # die Firestore-Regeln (firestore.rules) und die Google-Anmeldung.
  #
  # Bewusst nur DIESER eine Wert wird ausgenommen - der Scanner bleibt fuer
  # echte Geheimnisse (z.B. ein versehentlich eingefuegtes SMTP-Passwort) aktiv.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyA9pUq6DmHJiPxHwdT04EI7q7lxyRG8oJw"

[functions]
  node_bundler = "esbuild"

# Kein eigener Redirect fuer /api/* mehr noetig: die Function selbst
# registriert ihre Route direkt ueber "export const config = { path: '/api/*' }"
# (siehe netlify/functions/api.mts). Ein zusaetzlicher "force"-Redirect auf
# denselben Pfad hat genau das verhindert - er hat die Anfrage auf
# /.netlify/functions/api/:splat umgeschrieben, bevor die Function ueber
# ihren eigenen Pfad erreicht werden konnte, wodurch am Ende die normale
# React-Seite statt der Function-Antwort ausgeliefert wurde.

# Single-Page-App: alle uebrigen Pfade auf index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
