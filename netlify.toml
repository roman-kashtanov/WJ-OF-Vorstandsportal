# Netlify-Konfiguration - WJOF Vorstandsportal
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Kein eigener Redirect fuer /api/* mehr noetig: die Function selbst
# registriert ihre Route direkt ueber "export const config = { path: '/api/*' }"
# (siehe netlify/functions/api.mts). Ein zusaetzlicher "force"-Redirect auf
# denselben Pfad hat genau das verhindert - er hat die Anfrage auf
# /.netlify/functions/api/:splat umgeschrieben, bevor die Function ueber
# ihren eigenen Pfad erreicht werden konnte, wodurch am Ende die normale
# React-Seite statt der Function-Antwort ausgeliefert wurde.

# Single-Page-App: alle uebrigen Pfade auf index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
